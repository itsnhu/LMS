<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng...</title>

    <!-- ⭐ Chuyển hướng ngay lập tức về trang đăng nhập -->
    <meta http-equiv="refresh" content="0; url=dangnhap.html">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .loading-box {
            text-align: center;
            padding: 30px 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-box p {
            font-size: 0.95rem;
            opacity: 0.95;
            letter-spacing: 0.3px;
        }

        .loading-box a {
            color: #fff;
            font-weight: 600;
            text-decoration: underline;
            margin-top: 8px;
            display: inline-block;
            font-size: 0.85rem;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="loading-box">
        <div class="spinner"></div>
        <p>Đang chuyển đến trang đăng nhập...</p>
        <a href="dangnhap.html">Bấm vào đây nếu không tự chuyển</a>
    </div>

    <script>
        /* ⭐ Double safety: thẻ meta refresh + JS redirect song song */
        window.location.replace('dangnhap.html');
    </script>

</body>
</html>
